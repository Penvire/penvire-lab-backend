[versions]
# Application framework.
quarkus = "3.40.1"

# Java source generation and nullness annotations.
lombok = "1.18.48"
mapstruct = "1.6.3"
lombok-mapstruct-binding = "0.2.0"
# Pinned by the Quarkus BOM.
jspecify = "1.0.1"

# Static analysis, formatting and coverage.
errorprone = "2.53.0"
errorprone-plugin = "5.2.0"
nullaway = "0.14.4"
spotless = "8.11.0"
google-java-format = "2.0.0"
jacoco = "0.8.16"

# Tests outside Quarkus modules.
junit = "6.1.3"

# JSON parsing in framework-independent libraries.
jackson = "2.23.0"

[libraries]
# Quarkus BOM and its Gradle integration.
quarkus-bom = { module = "io.quarkus.platform:quarkus-bom", version.ref = "quarkus" }
quarkus-gradle-plugin = { module = "io.quarkus:gradle-application-plugin", version.ref = "quarkus" }

# Java source generation and JSpecify nullness annotations.
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombok-mapstruct-binding" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }

# Compiler checks and source formatting.
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
errorprone-gradle-plugin = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorprone-plugin" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

# Unit tests.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }

# JSON tree model and parser.
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
