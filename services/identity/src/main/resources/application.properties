quarkus.application.name=identity
quarkus.http.port=${PORT:8081}

penvire.identity.host=${IDENTITY_HOST:localhost}

# JWT
penvire.identity.issuer=${PENVIRE_IDENTITY_ISSUER}

# Token lifetimes
penvire.jwt.access-token.lifetime=PT5M
# Successful refresh resets the idle timeout. The absolute lifetime starts at login and never resets.
penvire.jwt.refresh-token.idle-timeout=P30D
penvire.jwt.refresh-token.absolute-lifetime=P6M

# Signing-key encryption (ADR 0007). The current KEK seals new keys; older KEKs stay listed so
# their keys can still be read until they are re-sealed.
%prod.penvire.identity.signing-key.kek.current=${IDENTITY_KEK_CURRENT}
%prod.penvire.identity.signing-key.kek.keys.k1=${IDENTITY_KEK_K1}

# Database: signing keys (ADR 0007). Flyway migrates the schema from db/migration at startup and
# Hibernate only validates it (libs/persistence defaults). Dev Services start PostgreSQL in dev mode
# and in tests, so only prod names a database.
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${IDENTITY_DB_URL}
%prod.quarkus.datasource.username=${IDENTITY_DB_USERNAME}
%prod.quarkus.datasource.password=${IDENTITY_DB_PASSWORD}

# Continuous testing in dev mode runs only Identity's tests, not those of the local libraries it
# depends on; their @QuarkusTests cannot boot inside Identity.
quarkus.test.only-test-application-module=true

# Health and metrics live on a separate management port. Probes call it
# directly; public routes only ever point at the application port.
quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9000}

# Dev defaults
%dev.penvire.identity.issuer=https://identity.example.dev

# Lab-only keys, generated for this repository; never real secrets.
%dev.penvire.identity.signing-key.kek.current=dev
%dev.penvire.identity.signing-key.kek.keys.dev=vRB5c3zYH/on5aDUqSZ1+DTI3aL4fRs9zSWJxPfnRAE=
%test.penvire.identity.signing-key.kek.current=test
%test.penvire.identity.signing-key.kek.keys.test=eKE542kzhL8i5nPj8BZRZYGYtvdEj7a1WHDtQRsAnW8=

# Test defaults
%test.penvire.identity.issuer=https://identity.example.test
%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0
