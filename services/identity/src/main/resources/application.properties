quarkus.application.name=identity
quarkus.http.port=${PORT:8081}

penvire.identity.host=${IDENTITY_HOST:localhost}

# JWT
penvire.identity.issuer=${PENVIRE_IDENTITY_ISSUER}

# Token lifetimes
penvire.jwt.access-token.lifetime=PT5M
# Successful refresh resets the idle timeout. The absolute lifetime starts at login and never resets.
penvire.jwt.refresh-token.idle-timeout=P30D
penvire.jwt.refresh-token.absolute-lifetime=P6M

# Health and metrics live on a separate management port. Probes call it
# directly; public routes only ever point at the application port.
quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9000}

# Dev defaults
%dev.penvire.identity.issuer=https://identity.example.dev

# Test defaults
%test.penvire.identity.issuer=https://identity.example.test
%test.quarkus.http.test-port=0
%test.quarkus.management.test-port=0
