# Defaults for every service using this library; a service's application.properties overrides them.
# The library ships the outbox schema in db/event. A service that sets its own locations must keep db/event.
quarkus.flyway.locations=db/migration,db/event
# Library migrations use the reserved versions V0_n and services start at V1. A library upgrade can
# bring V0_n after a service already applied V5. That is safe because neither side's tables
# reference the other's.
quarkus.flyway.out-of-order=true
