# Dev Services start PostgreSQL and Kafka. Leave Flyway unset here: EventDefaultsTest checks the
# library's own defaults.
quarkus.datasource.db-kind=postgresql
# Tests call the relay directly, so no scheduled run races them.
quarkus.scheduler.enabled=false
quarkus.otel.exporter.otlp.enabled=false
quarkus.otel.traces.exporter=none
# Short retries, so a failing handler reaches the dead-letter queue quickly.
penvire.event.consumer.backoff=PT0.01S

# The channel EventRoundTripTest consumes, configured as a service would.
mp.messaging.incoming.widget-round-trip.connector=smallrye-kafka
mp.messaging.incoming.widget-round-trip.topic=widget.round-trip
mp.messaging.incoming.widget-round-trip.group.id=round-trip
mp.messaging.incoming.widget-round-trip.auto.offset.reset=earliest
mp.messaging.incoming.widget-round-trip.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer
mp.messaging.incoming.widget-round-trip.failure-strategy=dead-letter-queue
mp.messaging.incoming.widget-round-trip.dead-letter-queue.topic=widget.round-trip.round-trip.dlt
