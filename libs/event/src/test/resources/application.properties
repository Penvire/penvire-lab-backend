# Dev Services start PostgreSQL and Kafka. Leave Flyway unset here: EventDefaultsTest checks the
# library's own defaults.
quarkus.datasource.db-kind=postgresql
# Tests call the relay directly, so no scheduled run races them.
quarkus.scheduler.enabled=false
quarkus.otel.exporter.otlp.enabled=false
quarkus.otel.traces.exporter=none
