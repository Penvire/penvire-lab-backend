# Dev Services start PostgreSQL and Kafka.
quarkus.datasource.db-kind=postgresql
# Records dev.penvire.lab.widget.events.v1.AuditRecorded on widget.audit, generated from src/test/avro
# like a contract package ships it. Set directly: the Gradle plugin's quarkus.application.name (the
# project name, audit) wins over application.properties.
penvire.audit.service=widget
# The relay would send the recorded events away before the tests read them.
quarkus.scheduler.enabled=false
quarkus.otel.exporter.otlp.enabled=false
quarkus.otel.traces.exporter=none
